version: 2
# Quiet by design: one check per quarter, one grouped pull request per ecosystem, at most two open at once.
# Security fixes are separate and still arrive as soon as they exist.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: quarterly }
    open-pull-requests-limit: 2
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: docker
    directory: /
    schedule: { interval: quarterly }
    open-pull-requests-limit: 2
    ignore:
      # The apps are tested on Python 3.12; a base-image jump is a deliberate change, not a Dependabot one.
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
    groups:
      all:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule: { interval: quarterly }
    open-pull-requests-limit: 2
    groups:
      all:
        patterns: ["*"]
