name: Release
# Push a tag such as v0.1.0 and this publishes the container image to ghcr.io and a GitHub release.
on:
  push:
    tags: ["v*"]

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      # The template repo itself only makes a GitHub release. Apps made from it are not templates,
      # so for them these three steps publish the container image.
      - if: ${{ !github.event.repository.is_template }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        if: ${{ !github.event.repository.is_template }}
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
      - if: ${{ !github.event.repository.is_template }}
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
