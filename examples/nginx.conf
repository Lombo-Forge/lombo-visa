# nginx in front of Jellyfin, with LomboVisa's gateway in front of the sign-in paths ONLY.
# A fragment for the `http` block. Not tested against a real nginx by the author: check it yourself.

server {
    listen 443 ssl;
    server_name jellyfin.example.com;
    # ssl_certificate ...; ssl_certificate_key ...;

    # Any path that mentions "authenticate", in any letter case, goes to the gateway. Wider than the three real
    # sign-in paths on purpose: the gateway answers 404 to everything that is not exactly a sign-in, so an oddly
    # spelled path cannot slip past it to Jellyfin. (A regex location is matched on the decoded path.)
    location ~* authenticate {
        client_max_body_size 64k;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # REPLACE the header with the address that connected, never append to what the visitor sent.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        # No URI after the address: nginx then passes the request path exactly as it arrived.
        proxy_pass http://lombo-visa-gateway:8099;
    }

    location / {
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_pass http://jellyfin:8096;
    }
}

# Keep your own rate limit (limit_req) on the sign-in location and keep Jellyfin's lockout on: the gateway decides by
# country only and does nothing about password guessing.
# Put this nginx's address in LOMBO_VISA_TRUSTED_PROXIES. If another proxy or a CDN is in front of nginx, use
# nginx's realip module so that $remote_addr is the visitor, or the gateway will see the CDN's address.
