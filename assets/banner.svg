    <radialGradient id="glow" cx=".18" cy=".5" r=".6"><stop offset="0" stop-color="#ff6a1a" stop-opacity=".28"/><stop offset="1" stop-color="#0d0a08" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="300" fill="#0d0a08"/>
